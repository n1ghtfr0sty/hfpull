name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_project
      - name: Run tests
        working-directory: rust_project
        run: cargo test --locked --all-features

  binaries:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: hf-pull-linux-x86_64
            ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: hf-pull-macos-x86_64
            ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: hf-pull-macos-aarch64
            ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: hf-pull-windows-x86_64
            ext: zip
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset: hf-pull-linux-x86_64-musl
            ext: tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: "Linux: add musl target + cross-link tools"
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_project


      - name: Build release binary
        working-directory: rust_project
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          BIN_NAME="hf-pull"
          TARGET_DIR="rust_project/target/${{ matrix.target }}/release"
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            BIN_NAME="hf-pull.exe"
          fi
          BIN_PATH="$TARGET_DIR/$BIN_NAME"
          if [ ! -f "$BIN_PATH" ]; then
            echo "::error::Binary not found at $BIN_PATH"
            exit 1
          fi
          mkdir -p release-out
          cp "$BIN_PATH" "release-out/$BIN_NAME"
          if [ "${{ matrix.ext }}" = "tar.gz" ]; then
            tar -C release-out -czf "${{ matrix.asset }}.tar.gz" "$BIN_NAME"
            echo "ASSET=${{ matrix.asset }}.tar.gz" >> "$GITHUB_ENV"
          else
            (cd release-out && zip -q "../${{ matrix.asset }}.zip" "$BIN_NAME")
            echo "ASSET=${{ matrix.asset }}.zip" >> "$GITHUB_ENV"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 7

  checksums:
    name: Aggregate checksums
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Compute checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS
      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/SHA256SUMS

  publish:
    name: Publish GitHub Release
    needs: [binaries, checksums]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
          fail_on_unmatched_files: true
